name: Build QueueRadarIR APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -o QueueRadarIR.zip -d project

          echo "ZIP CONTENT:"
          find project -maxdepth 5 -type f | sort

      - name: Detect project directory
        run: |
          if [ -f "project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            DIR=$(find project -name settings.gradle.kts -type f -print -quit | xargs dirname)
            echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Fix Java/Kotlin JVM target
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QueueRadarIR-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
