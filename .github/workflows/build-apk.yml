package ir.queueradar.app

import android.os.Bundle
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent
import androidx.compose.foundation.layout.*
import androidx.compose.foundation.lazy.LazyColumn
import androidx.compose.foundation.lazy.items
import androidx.compose.material3.*
import androidx.compose.runtime.*
import androidx.compose.ui.Modifier
import androidx.compose.ui.text.font.FontWeight
import androidx.compose.ui.unit.dp
import androidx.lifecycle.ViewModel
import androidx.lifecycle.viewModelScope
import androidx.lifecycle.viewmodel.compose.viewModel
import kotlinx.coroutines.delay
import kotlinx.coroutines.launch
import kotlin.random.Random

class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContent {
            QueueRadarApp()
        }
    }
}

data class SymbolState(
    val symbol: String,
    val price: Int,
    val queue: Long,
    val queueDelta: Int,
    val trades: Int,
    val risk: Int,
    val state: String
)

class RadarViewModel : ViewModel() {

    var symbols by mutableStateOf(
        listOf(
            SymbolState(
                "وتجارت",
                951,
                12400000,
                -18,
                1832,
                34,
                "صف خرید سالم"
            ),
            SymbolState(
                "فملی",
                4230,
                8700000,
                -41,
                2640,
                72,
                "در حال تخلیه"
            ),
            SymbolState(
                "خودرو",
                3380,
                21500000,
                -63,
                5210,
                91,
                "احتمال شکست صف"
            ),
            SymbolState(
                "شستا",
                2145,
                6300000,
                8,
                1140,
                22,
                "صف خرید قوی"
            )
        )
    )
        private set

    var lastUpdate by mutableStateOf("اکنون")
        private set

    init {
        viewModelScope.launch {
            while (true) {
                delay(4000)

                symbols = symbols.map { s ->

                    val newRisk = (
                        s.risk + Random.nextInt(-2, 4)
                    ).coerceIn(0, 100)

                    val newQueueDelta = (
                        s.queueDelta + Random.nextInt(-3, 4)
                    ).coerceIn(-100, 100)

                    val newState = when {
                        newRisk >= 85 -> "احتمال شکست صف"
                        newRisk >= 60 -> "در حال تخلیه"
                        newRisk >= 35 -> "تحت نظر"
                        else -> "صف خرید سالم"
                    }

                    s.copy(
                        risk = newRisk,
                        queueDelta = newQueueDelta,
                        state = newState
                    )
                }

                lastUpdate = "چند ثانیه پیش"
            }
        }
    }
}

@Composable
fun QueueRadarApp(
    vm: RadarViewModel = viewModel()
) {

    var tab by remember {
        mutableIntStateOf(0)
    }

    MaterialTheme {

        Scaffold(

            topBar = {
                TopAppBar(
                    title = {
                        Text(
                            "صف‌بان ایران",
                            fontWeight = FontWeight.Bold
                        )
                    },
                    actions = {
                        Text(
                            "● زنده",
                            color = MaterialTheme.colorScheme.primary,
                            modifier = Modifier.padding(end = 16.dp)
                        )
                    }
                )
            },

            bottomBar = {

                NavigationBar {

                    listOf(
                        "رادار",
                        "واچ‌لیست",
                        "هشدارها"
                    ).forEachIndexed { index, title ->

                        NavigationBarItem(

                            selected = tab == index,

                            onClick = {
                                tab = index
                            },

                            icon = {},

                            label = {
                                Text(title)
                            }
                        )
                    }
                }
            }

        ) { padding ->

            when (tab) {

                0 -> RadarScreen(
                    vm = vm,
                    padding = padding
                )

                1 -> WatchlistScreen(
                    vm = vm,
                    padding = padding
                )

                else -> AlertsScreen(
                    padding = padding
                )
            }
        }
    }
}

@Composable
fun RadarScreen(
    vm: RadarViewModel,
    padding: PaddingValues
) {

    LazyColumn(

        contentPadding = PaddingValues(16.dp),

        verticalArrangement = Arrangement.spacedBy(10.dp),

        modifier = Modifier.padding(padding)

    ) {

        item {

            Text(
                "رادار صف خرید",
                style = MaterialTheme.typography.headlineSmall,
                fontWeight = FontWeight.Bold
            )

            Spacer(
                modifier = Modifier.height(4.dp)
            )

            Text(
                "به‌روزرسانی: ${vm.lastUpdate}"
            )

            Spacer(
                modifier = Modifier.height(8.dp)
            )
        }

        items(vm.symbols) { symbol ->

            SymbolCard(symbol)
        }
    }
}

@Composable
fun SymbolCard(
    symbol: SymbolState
) {

    Card(
        modifier = Modifier.fillMaxWidth()
    ) {

        Column(
            modifier = Modifier.padding(16.dp),
            verticalArrangement = Arrangement.spacedBy(8.dp)
        ) {

            Row(
                modifier = Modifier.fillMaxWidth(),
                horizontalArrangement = Arrangement.SpaceBetween
            ) {

                Text(
                    symbol.symbol,
                    fontWeight = FontWeight.Bold
                )

                Text(
                    symbol.state,
                    fontWeight = FontWeight.Bold
                )
            }

            Row(
                modifier = Modifier.fillMaxWidth(),
                horizontalArrangement = Arrangement.SpaceBetween
            ) {

                Text(
                    "صف: ${symbol.queue / 1_000_000.0}M"
                )

                Text(
                    "ریسک شکست: ${symbol.risk}%"
                )

                Text(
                    "معاملات: ${symbol.trades}"
                )
            }

            LinearProgressIndicator(
                progress = {
                    symbol.risk / 100f
                },
                modifier = Modifier.fillMaxWidth()
            )

            when {
                symbol.risk >= 85 -> {

                    Text(
                        "⚠ هشدار: احتمال بالای شکست صف",
                        fontWeight = FontWeight.Bold
                    )
                }

                symbol.risk >= 60 -> {

                    Text(
                        "⚠ هشدار: صف در حال ضعیف‌شدن است"
                    )
                }
            }
        }
    }
}

@Composable
fun WatchlistScreen(
    vm: RadarViewModel,
    padding: PaddingValues
) {

    Column(
        modifier = Modifier
            .padding(padding)
            .padding(16.dp)
    ) {

        Text(
            "واچ‌لیست",
            style = MaterialTheme.typography.headlineSmall,
            fontWeight = FontWeight.Bold
        )

        Spacer(
            modifier = Modifier.height(12.dp)
        )

        vm.symbols.forEach { symbol ->

            Row(
                modifier = Modifier
                    .fillMaxWidth()
                    .padding(vertical = 8.dp),

                horizontalArrangement =
                    Arrangement.SpaceBetween
            ) {

                Text(
                    symbol.symbol
                )

                Text(
                    "${symbol.risk}%"
                )
            }
        }
    }
}

